<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBBE-MULTISERVICES.CI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 flex items-center justify-center font-sans">

  <main class="w-full max-w-xl space-y-6">

    <!-- EN-TÊTE -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-xl font-bold text-white shadow-md">⚡</div>
        <div>
          <h1 class="text-lg font-bold tracking-wide text-slate-900">GBBE-MULTISERVICES.CI</h1>
          <p class="text-xs text-slate-500">Guichet Automatisé de Transfert</p>
        </div>
      </div>
      <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-semibold border border-emerald-200">
        ● Service Actif
      </span>
    </header>

    <!-- CARTE BLANCHE DE TRANSACTION -->
    <div class="bg-white border border-slate-200 p-6 md:p-8 rounded-3xl shadow-xl space-y-5">
      
      <div>
        <h2 class="text-xl font-bold text-slate-900 mb-1">Passer une transaction</h2>
        <p class="text-xs text-slate-500">Sélectionnez les réseaux et saisissez les informations de transfert.</p>
      </div>

      <!-- SÉLECTION RÉSEAUX -->
      <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-4">
        
        <!-- Réseau Source -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">💳 Réseau Source (Débit)</label>
          <select id="sourceNet" onchange="updateUI()" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="wave">Wave</option>
            <option value="om">Orange Money</option>
            <option value="momo">MTN Mobile Money</option>
            <option value="moov">Moov Money</option>
          </select>
          <input type="tel" id="sourcePhone" placeholder="Ex: 0707070707" maxlength="10" class="w-full mt-2 bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p id="sourceError" class="text-xs text-red-500 font-semibold mt-1 hidden"></p>
        </div>

        <div class="text-center text-slate-400 font-bold">↓</div>

        <!-- Réseau Destination -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">👤 Réseau Destination (Crédit)</label>
          <select id="destNet" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="om">Orange Money</option>
            <option value="wave">Wave</option>
            <option value="momo">MTN Mobile Money</option>
            <option value="moov">Moov Money</option>
          </select>
          <input type="tel" id="destPhone" placeholder="Ex: 0505050505" maxlength="10" class="w-full mt-2 bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <p id="destError" class="text-xs text-red-500 font-semibold mt-1 hidden"></p>
        </div>

      </div>

      <!-- MONTANT ET CALCULATEUR -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Montant à transférer (FCFA)</label>
          <div class="relative">
            <input type="number" id="txAmount" oninput="runCalculator()" onkeyup="runCalculator()" placeholder="Ex: 50000" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-base font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-16">
            <span class="absolute right-3 top-3.5 text-xs font-bold text-slate-400">FCFA</span>
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Montant min: 250 FCFA — Max: 300 000 FCFA</p>
        </div>

        <!-- CALCULATEUR DYNAMIQUE (FRAIS OU RÉDUCTION) -->
        <div class="bg-blue-50/60 p-4 rounded-2xl border border-blue-100 space-y-2">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-xs font-semibold text-slate-700">Prendre en charge les frais de service ?</span>
            <input type="checkbox" id="payFeesToggle" onchange="runCalculator()" class="w-4 h-4 text-blue-600 rounded">
          </label>
          <div class="text-xs border-t border-blue-100 pt-2 space-y-1">
            <div class="flex justify-between text-slate-500">
              <span>Ajustement :</span>
              <span id="feeDisplay" class="font-bold text-slate-800">0 FCFA</span>
            </div>
            <div class="flex justify-between text-slate-900 font-bold text-sm pt-1">
              <span>Total à débiter :</span>
              <span id="totalDisplay" class="text-blue-600">0 FCFA</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BOUTON DYNAMIQUE -->
      <button type="button" id="payButton" onclick="processTransaction()" class="w-full py-4 bg-sky-400 hover:bg-sky-500 text-slate-950 font-bold rounded-2xl shadow-md transition-all">
        Payer avec Wave 🌊
      </button>

    </div>

  </main>

  <!-- LOGIQUE JS INTÉGRÉE (AUCUN BUG DE CHARGEMENT) -->
  <script>
    const WAVE_PAYMENT_URL = "https://pay.wave.com/m/M_ci_QJOfA_vl3LNC/c/ci/";

    // Adaptation du bouton selon l'opérateur
    function updateUI() {
      const source = document.getElementById('sourceNet').value;
      const btn = document.getElementById('payButton');

      if (source === 'wave') {
        btn.className = "w-full py-4 rounded-2xl font-bold transition-all shadow-md text-slate-950 bg-sky-400 hover:bg-sky-500";
        btn.textContent = "Payer avec Wave 🌊";
      } else if (source === 'om') {
        btn.className = "w-full py-4 rounded-2xl font-bold transition-all shadow-md text-white bg-orange-500 hover:bg-orange-600";
        btn.textContent = "Payer avec Orange Money 🟠";
      } else if (source === 'momo') {
        btn.className = "w-full py-4 rounded-2xl font-bold transition-all shadow-md text-slate-950 bg-yellow-400 hover:bg-yellow-500";
        btn.textContent = "Payer avec MTN MoMo 🟡";
      } else if (source === 'moov') {
        btn.className = "w-full py-4 rounded-2xl font-bold transition-all shadow-md text-white bg-blue-600 hover:bg-blue-700";
        btn.textContent = "Payer avec Moov Money 🔵";
      }
    }

    // Calcul direct du montant et des frais / réduction
    function runCalculator() {
      const inputVal = document.getElementById('txAmount').value.trim();
      const isFeesChecked = document.getElementById('payFeesToggle').checked;
      const feeDisplay = document.getElementById('feeDisplay');
      const totalDisplay = document.getElementById('totalDisplay');

      const amount = parseFloat(inputVal);

      if (isNaN(amount) || amount <= 0) {
        feeDisplay.textContent = "0 FCFA";
        totalDisplay.textContent = "0 FCFA";
        return;
      }

      let total = amount;
      let text = "0 FCFA";

      if (isFeesChecked) {
        // Le client prend en charge les frais : +1% (min 100 FCFA)
        const fees = Math.max(100, Math.round(amount * 0.01));
        total = amount + fees;
        text = "+" + fees.toLocaleString('fr-FR') + " FCFA (+1%)";
      } else {
        // Le client ne prend pas en charge les frais : Réduction de 1%
        const discount = Math.round(amount * 0.01);
        total = amount - discount;
        text = "-" + discount.toLocaleString('fr-FR') + " FCFA (-1%)";
      }

      feeDisplay.textContent = text;
      totalDisplay.textContent = total.toLocaleString('fr-FR') + " FCFA";
    }

    // Validation des préfixes CI
    function checkNetworkPrefix(network, phone) {
      if (!phone || phone.length !== 10) return false;
      const p = phone.substring(0, 2);

      if (network === 'om') return ['07', '08', '09'].includes(p);
      if (network === 'momo') return p === '05';
      if (network === 'moov') return ['01', '02'].includes(p);
      if (network === 'wave') return ['01', '02', '05', '07', '08', '09'].includes(p);
      return true;
    }

    // Soumission de la transaction
    function processTransaction() {
      const sourceNet = document.getElementById('sourceNet').value;
      const sourcePhone = document.getElementById('sourcePhone').value.trim();
      const destNet = document.getElementById('destNet').value;
      const destPhone = document.getElementById('destPhone').value.trim();
      const amount = document.getElementById('txAmount').value;

      const sourceErr = document.getElementById('sourceError');
      const destErr = document.getElementById('destError');

      sourceErr.classList.add('hidden');
      destErr.classList.add('hidden');

      let hasError = false;

      // Vérification Orange sélectionné avec numéro MTN/Moov
      if (!checkNetworkPrefix(sourceNet, sourcePhone)) {
        sourceErr.textContent = ⚠️ Numéro non conforme au réseau ${sourceNet.toUpperCase()}.;
        sourceErr.classList.remove('hidden');
        hasError = true;
      }

      if (!checkNetworkPrefix(destNet, destPhone)) {
        destErr.textContent = ⚠️ Numéro non conforme au réseau ${destNet.toUpperCase()}.;
        destErr.classList.remove('hidden');
        hasError = true;
      }

      if (!amount || amount < 250) {
        alert("Veuillez saisir un montant d'au moins 250 FCFA.");
        return;
      }

      if (hasError) return;

      if (sourceNet === 'wave') {
        window.location.href = WAVE_PAYMENT_URL;
      } else {
        alert(Transaction de ${amount} FCFA validée.\nRedirection vers le réseau ${sourceNet.toUpperCase()}...);
      }
    }
  </script>
</body>
</html>
