<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guichet - GBBE-MULTISERVICES.CI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-blue-600">GBBE-MULTISERVICES.CI</h1>
            <button onclick="logout()" class="text-red-500 text-sm font-semibold hover:underline">Déconnexion</button>
        </div>

        <h2 class="text-lg font-semibold mb-4">Effectuer un transfert</h2>
        
        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Réseau source (À débiter)</label>
                <select id="sourceNet" class="w-full px-3 py-2 border rounded-lg">
                    <option value="Orange Money">Orange Money</option>
                    <option value="MTN Money">MTN Money</option>
                    <option value="Moov Money">Moov Money</option>
                    <option value="Wave">Wave</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Numéro expéditeur</label>
                <input type="text" id="sourcePhone" placeholder="Ex: 0700000000" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Réseau destination (À créditer)</label>
                <select id="destNet" class="w-full px-3 py-2 border rounded-lg">
                    <option value="Orange Money">Orange Money</option>
                    <option value="MTN Money">MTN Money</option>
                    <option value="Moov Money">Moov Money</option>
                    <option value="Wave">Wave</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Numéro destinataire</label>
                <input type="text" id="destPhone" placeholder="Ex: 0500000000" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Montant (FCFA)</label>
                <input type="number" id="amount" placeholder="Ex: 5000" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button onclick="submitTransaction()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Valider le transfert</button>
            <p id="tx-msg" class="text-center text-sm mt-2"></p>
        </div>

        <h2 class="text-lg font-semibold mb-2">Historique de vos transactions</h2>
        <div id="history-container" class="space-y-2 border-t pt-4">
            <p class="text-gray-500 text-sm">Chargement des transactions...</p>
        </div>
    </div>

    <script>
        const userPhone = localStorage.getItem('userPhone');
        if (!userPhone) {
            window.location.href = '/auth.html';
        }

        async function submitTransaction() {
            const sourceNet = document.getElementById('sourceNet').value;
            const sourcePhone = document.getElementById('sourcePhone').value;
            const destNet = document.getElementById('destNet').value;
            const destPhone = document.getElementById('destPhone').value;
            const amount = document.getElementById('amount').value;
            const msg = document.getElementById('tx-msg');

            if (!sourcePhone || !destPhone || !amount) {
                msg.innerText = "Veuillez remplir tous les champs.";
                msg.className = "text-center text-sm mt-2 text-red-500";
                return;
            }

            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userPhone, sourceNet, sourcePhone, destNet, destPhone, amount })
                });
                const data = await res.json();

                if (data.success) {
                    msg.innerText = "Transaction effectuée avec succès !";
                    msg.className = "text-center text-sm mt-2 text-green-600";
                    loadHistory();
                } else {
                    msg.innerText = data.error || "Erreur lors de la transaction.";
                    msg.className = "text-center text-sm mt-2 text-red-500";
                }
            } catch (err) {
                msg.innerText = "Erreur de connexion au serveur.";
                msg.className = "text-center text-sm mt-2 text-red-500";
            }
        }

        async function loadHistory() {
            const container = document.getElementById('history-container');
            try {
                const res = await fetch(/api/transactions/${userPhone});
                const data = await res.json();

                if (data.success && data.transactions.length > 0) {
                    container.innerHTML = data.transactions.map(tx => `
                        <div class="bg-gray-50 p-3 rounded-lg border text-sm flex justify-between items-center">
                            <div>
                                <span class="font-bold">${tx.source_net} (${tx.source_phone})</span> ➡️ 
                                <span class="font-bold">${tx.dest_net} (${tx.dest_phone})</span>
                                <div class="text-gray-500 text-xs">${new Date(tx.created_at).toLocaleString()}</div>
                            </div>
                            <div class="font-bold text-blue-600">${tx.amount} FCFA</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-sm">Aucune transaction enregistrée pour le moment.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="text-red-500 text-sm">Impossible de charger l\'historique.</p>';
            }
        }

        function logout() {
            localStorage.removeItem('userPhone');
            window.location.href = '/auth.html';
        }

        loadHistory();
    </script>
</body>
</html>
