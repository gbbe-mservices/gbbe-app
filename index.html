<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBBE-MULTISERVICES.CI - Guichet Automatisé</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <!-- En-tête -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-xl font-bold text-blue-600">GBBE-MULTISERVICES.CI</h1>
                <p class="text-xs text-slate-500">Guichet automatisé</p>
            </div>
            <button onclick="logout()" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-200 transition">Déconnexion</button>
        </div>

        <!-- Formulaire de Transfert -->
        <div class="mb-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Effectuer un transfert</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Réseau source (À débiter)</label>
                    <select id="sourceNet" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Orange Money">Orange Money</option>
                        <option value="MTN Money">MTN Money</option>
                        <option value="Moov Money">Moov Money</option>
                        <option value="Wave">Wave</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Numéro expéditeur</label>
                    <input type="text" id="sourcePhone" placeholder="Ex: 0707597541" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Réseau destination (À créditer)</label>
                    <select id="destNet" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Orange Money">Orange Money</option>
                        <option value="MTN Money">MTN Money</option>
                        <option value="Moov Money">Moov Money</option>
                        <option value="Wave">Wave</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Numéro destinataire</label>
                    <input type="text" id="destPhone" placeholder="Ex: 0777046526" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Montant (FCFA)</label>
                    <input type="number" id="amount" placeholder="Ex: 50000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button onclick="submitTransaction()" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition shadow">Valider le transfert</button>
                <p id="tx-msg" class="text-center text-sm mt-2"></p>
            </div>
        </div>

        <!-- Historique -->
        <div>
            <h2 class="text-lg font-semibold text-slate-800 mb-3">Historique de vos transactions</h2>
            <div id="history-container" class="space-y-2 border-t pt-4">
                <p class="text-slate-500 text-sm">Chargement des transactions...</p>
            </div>
        </div>
    </div>

    <script>
        // Vérification de la session utilisateur
        const userPhone = localStorage.getItem('userPhone');
        if (!userPhone) {
            window.location.href = '/auth.html';
        }

        async function submitTransaction() {
            const sourceNet = document.getElementById('sourceNet').value;
            const sourcePhone = document.getElementById('sourcePhone').value;
            const destNet = document.getElementById('destNet').value;
            const destPhone = document.getElementById('destPhone').value;
            const amount = document.getElementById('amount').value;
            const msg = document.getElementById('tx-msg');

            if (!sourcePhone || !destPhone || !amount) {
                msg.innerText = "Veuillez remplir tous les champs.";
                msg.className = "text-center text-sm mt-2 text-red-500 font-semibold";
                return;
            }

            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userPhone, sourceNet, sourcePhone, destNet, destPhone, amount })
                });
                const data = await res.json();

                if (data.success) {
                    msg.innerText = "Transaction effectuée avec succès !";
                    msg.className = "text-center text-sm mt-2 text-green-600 font-semibold";
                    document.getElementById('amount').value = '';
                    loadHistory();
                } else {
                    msg.innerText = data.error || "Erreur lors de la transaction.";
                    msg.className = "text-center text-sm mt-2 text-red-500 font-semibold";
                }
            } catch (err) {
                msg.innerText = "Erreur de connexion au serveur.";
                msg.className = "text-center text-sm mt-2 text-red-500 font-semibold";
            }
        }

        async function loadHistory() {
            const container = document.getElementById('history-container');
            try {
                const res = await fetch(/api/transactions/${userPhone});
                const data = await res.json();

                if (data.success && data.transactions.length > 0) {
                    container.innerHTML = data.transactions.map(tx => `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm flex justify-between items-center">
                            <div>
                                <span class="font-bold text-slate-700">${tx.source_net} (${tx.source_phone})</span> ➡️ 
                                <span class="font-bold text-slate-700">${tx.dest_net} (${tx.dest_phone})</span>
                                <div class="text-slate-400 text-xs">${new Date(tx.created_at).toLocaleString()}</div>
                            </div>
                            <div class="font-bold text-blue-600 text-base">${tx.amount} FCFA</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-slate-500 text-sm">Aucune transaction enregistrée pour le moment.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="text-red-500 text-sm">Impossible de charger l\'historique.</p>';
            }
        }

        function logout() {
            localStorage.removeItem('userPhone');
            window.location.href = '/auth.html';
        }

        // Charger l'historique au démarrage de la page
        loadHistory();
    </script>
</body>
</html>
