<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBBE MULTI-SERVICES - Transfert d'argent</title>

  <!-- SDK KKIAPAY -->
  <script src="https://cdn.kkiapay.me/k.js"></script>
  
  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: var(--card-bg);
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      max-width: 440px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: #eff6ff;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      font-size: 26px;
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--subtext);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      color: var(--text);
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background-color: var(--primary-dark);
    }

    button:active {
      transform: scale(0.99);
    }

    /* Badges de réseaux & Sécurité */
    .network-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 10px 0;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      color: white;
    }
    .badge-orange { background: #ff6600; }
    .badge-wave { background: #1dc4e9; }
    .badge-mtn { background: #ffcc00; color: #000; }
    .badge-moov { background: #008751; }

    .security-note {
      text-align: center;
      font-size: 12px;
      color: var(--subtext);
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="brand-logo">
      <i class="fa-solid fa-money-bill-transfer"></i>
    </div>
    <h2>GBBE MULTI-SERVICES</h2>
    <p>Transfert d'argent instantané inter-réseaux</p>
  </div>

  <form id="transfertForm">
    <div class="form-group">
      <label for="montant">Montant à envoyer (FCFA) :</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-coins input-icon"></i>
        <input type="number" id="montant" placeholder="Ex: 10000" required>
      </div>
    </div>

    <div class="form-group">
      <label>Réseau d'origine (Vous payez par) :</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-wallet input-icon"></i>
        <select>
          <option>Orange Money</option>
          <option>Wave</option>
          <option>MTN MoMo</option>
          <option>Moov Money</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Votre numéro de téléphone :</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-phone input-icon"></i>
        <input type="tel" placeholder="Ex: 0700000000" required>
      </div>
    </div>

    <div class="form-group">
      <label>Réseau de destination (Le destinataire reçoit sur) :</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-building-columns input-icon"></i>
        <select>
          <option>Wave</option>
          <option>Orange Money</option>
          <option>MTN MoMo</option>
          <option>Moov Money</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Numéro du destinataire :</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-user-check input-icon"></i>
        <input type="tel" placeholder="Ex: 0500000000" required>
      </div>
    </div>

    <button type="submit">
      <i class="fa-solid fa-lock"></i> Valider le transfert
    </button>
  </form>

  <div class="network-badges">
    <span class="badge badge-orange">Orange</span>
    <span class="badge badge-wave">Wave</span>
    <span class="badge badge-mtn">MTN</span>
    <span class="badge badge-moov">Moov</span>
  </div>

  <div class="security-note">
    <i class="fa-solid fa-shield-halved" style="color: #10b981;"></i> Paiement 100% sécurisé via Kkiapay
  </div>
</div>

<script>
  document.getElementById("transfertForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const montantSaisi = document.getElementById("montant").value;

    if (!montantSaisi || montantSaisi <= 0) {
      alert("Veuillez saisir un montant valide.");
      return;
    }

    if (typeof openKkiapayWidget !== "function") {
      alert("Le script Kkiapay n'a pas pu s'initialiser. Vérifiez votre connexion internet.");
      return;
    }

    openKkiapayWidget({
      amount: parseInt(montantSaisi),
      key: "4d5ffb66fe492b03076b0a2b1a1720d4de243401",
      sandbox: true, // Remplacez par false une fois le compte Kkiapay activé
      callback: "https://gbbe-app.onrender.com"
    });
  });
</script>

</body>
</html>
