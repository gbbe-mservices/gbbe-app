<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBBE-MULTISERVICES.CI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-6 font-sans">

  <main class="max-w-md mx-auto space-y-6">

    <!-- ÉTAPE 1 : SELECTION DU MOYEN DE PAIEMENT -->
    <div id="stepNetwork" class="space-y-3">
      <h2 class="text-lg font-bold text-slate-900 mb-4 text-center">Sélectionnez le moyen de paiement</h2>
      
      <button type="button" onclick="selectOperator('wave')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-sky-400 transition-all">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-sky-400 rounded-xl flex items-center justify-center text-white font-bold">🌊</div>
          <span class="font-bold text-slate-800">Wave</span>
        </div>
        <span class="text-slate-400">›</span>
      </button>

      <button type="button" onclick="selectOperator('momo')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-yellow-400 transition-all">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center text-slate-950 font-bold">🟡</div>
          <span class="font-bold text-slate-800">MTN Money</span>
        </div>
        <span class="text-slate-400">›</span>
      </button>

      <button type="button" onclick="selectOperator('moov')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-blue-600 transition-all">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">🔵</div>
          <span class="font-bold text-slate-800">Moov Money</span>
        </div>
        <span class="text-slate-400">›</span>
      </button>

      <button type="button" onclick="selectOperator('om')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-orange-500 transition-all">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold">🟠</div>
          <span class="font-bold text-slate-800">Orange Money</span>
        </div>
        <span class="text-slate-400">›</span>
      </button>
    </div>

    <!-- ÉTAPE 2 : FORMULAIRE & CALCULATEUR -->
    <div id="stepForm" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4 hidden">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-900" id="selectedOperatorTitle">Transaction Wave</h3>
        <button type="button" onclick="resetOperator()" class="text-xs text-blue-600 font-semibold">Changer</button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Numéro de téléphone</label>
        <input type="tel" id="sourcePhone" placeholder="Ex: 0707070707" maxlength="10" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500">
        <p id="sourceError" class="text-xs text-red-500 font-semibold mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Montant à transférer (FCFA)</label>
        <input type="number" id="txAmount" placeholder="Ex: 5000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:border-blue-500">
      </div>

      <!-- BLOC CALCULATEUR DYNAMIQUE -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-semibold text-slate-700">Prendre en charge les frais de service ?</span>
          <input type="checkbox" id="payFeesToggle" class="w-4 h-4 text-blue-600 rounded">
        </label>

        <div class="text-xs space-y-1 border-t pt-2 border-slate-200">
          <div class="flex justify-between text-slate-500">
            <span>Ajustement / Frais :</span>
            <span id="feeDisplay" class="font-semibold text-slate-800">0 FCFA</span>
          </div>
          <div class="flex justify-between text-slate-900 font-bold text-sm pt-1">
            <span>Total à débiter :</span>
            <span id="totalDisplay" class="text-blue-600">0 FCFA</span>
          </div>
        </div>
      </div>

      <button type="button" id="payButton" onclick="submitTransaction()" class="w-full py-4 bg-sky-400 hover:bg-sky-500 text-slate-950 font-bold rounded-2xl shadow-sm transition-all">
        Valider et Payer
      </button>
    </div>

    <!-- ÉTAPE 3 : PHARMACIES DE GARDE (AFFICHAGE AUTOMATIQUE SANS GPS) -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-900">Pharmacies de garde</h3>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full font-bold">En direct</span>
      </div>

      <input type="text" id="pharmacySearch" oninput="filterPharmacies()" placeholder="Rechercher une pharmacie, ville, quartier..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500">

      <!-- Liste automatique -->
      <div id="pharmacyResults" class="space-y-3 pt-1 max-h-80 overflow-y-auto">
        <!-- Rempli automatiquement par pharmacy.js -->
      </div>
    </div>

  </main>

  <script src="calculator.js"></script>
  <script src="pharmacy.js"></script>
</body>
</html>
