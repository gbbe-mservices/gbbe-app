<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBBE MULTI-SERVICES - Transfert d'argent</title>

  <!-- SDK KKIAPAY -->
  <script src="https://cdn.kkiapay.me/k.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }
    .header {
      text-align: center;
      background: #1a365d;
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .header h2 { margin: 0; font-size: 20px; }
    .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>GBBE MULTI-SERVICES</h2>
    <p>Transfert d'argent instantané inter-réseaux</p>
  </div>

  <form id="transfertForm">
    <div class="form-group">
      <label for="montant">Montant à envoyer (FCFA) :</label>
      <input type="number" id="montant" placeholder="Ex: 10000" required>
    </div>

    <div class="form-group">
      <label>Réseau d'origine (Vous payez par) :</label>
      <select>
        <option>Orange Money</option>
        <option>Wave</option>
        <option>MTN MoMo</option>
        <option>Moov Money</option>
      </select>
    </div>

    <div class="form-group">
      <label>Votre numéro de téléphone :</label>
      <input type="tel" placeholder="Ex: 0700000000" required>
    </div>

    <div class="form-group">
      <label>Réseau de destination (Le destinataire reçoit sur) :</label>
      <select>
        <option>Wave</option>
        <option>Orange Money</option>
        <option>MTN MoMo</option>
        <option>Moov Money</option>
      </select>
    </div>

    <div class="form-group">
      <label>Numéro du destinataire :</label>
      <input type="tel" placeholder="Ex: 0500000000" required>
    </div>

    <button type="submit">Valider le transfert</button>
  </form>
</div>

<script>
  document.getElementById("transfertForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const montantSaisi = document.getElementById("montant").value;

    if (!montantSaisi || montantSaisi <= 0) {
      alert("Veuillez saisir un montant valide.");
      return;
    }

    if (typeof openKKiapayWidget !== "function") {
      alert("Le script Kkiapay n'a pas pu s'initialiser. Vérifiez votre connexion internet.");
      return;
    }

    openKkiapayWidget({
      amount: parseInt(montantSaisi),
      key: "4d5ffb66fe492b03076b0a2b1a1720d4de243401",
      sandbox: false,
      callback: "https://gbbe-app.onrender.com"
    });
  });
</script>

</body>
</html>
