<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBBE-MULTISERVICES.CI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

  <main class="w-full max-w-xl space-y-6">

    <!-- EN-TÊTE -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-xl font-bold shadow-lg shadow-blue-500/20">⚡</div>
        <div>
          <h1 class="text-lg font-bold tracking-wide text-white">GBBE-MULTISERVICES.CI</h1>
          <p class="text-xs text-slate-400">Guichet Automatisé de Transfert</p>
        </div>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20 font-medium flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Service Actif
      </span>
    </header>

    <!-- CARTE DE TRANSACTION -->
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl shadow-xl space-y-5">
      
      <div>
        <h2 class="text-xl font-bold text-white mb-1">Passer une transaction</h2>
        <p class="text-xs text-slate-400">Sélectionnez les réseaux et saisissez les informations de transfert.</p>
      </div>

      <!-- FORMULAIRE SÉLECTION RÉSEAUX -->
      <div class="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl space-y-4">
        
        <!-- Réseau Source -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">💳 Réseau Source (Débit)</label>
          <select id="sourceNet" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="wave">Wave</option>
            <option value="om">Orange Money</option>
            <option value="momo">MTN Mobile Money</option>
            <option value="moov">Moov Money</option>
          </select>
          <input type="tel" id="sourcePhone" placeholder="Ex: 0707070707" maxlength="10" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
          <p id="sourceError" class="text-xs text-red-400 hidden font-semibold mt-1"></p>
        </div>

        <div class="text-center text-slate-500 font-bold">↓</div>

        <!-- Réseau Destination -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">👤 Réseau Destination (Crédit)</label>
          <select id="destNet" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="om">Orange Money</option>
            <option value="wave">Wave</option>
            <option value="momo">MTN Mobile Money</option>
            <option value="moov">Moov Money</option>
          </select>
          <input type="tel" id="destPhone" placeholder="Ex: 0505050505" maxlength="10" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500">
          <p id="destError" class="text-xs text-red-400 hidden font-semibold mt-1"></p>
        </div>

      </div>

      <!-- MONTANT ET CALCULATEUR -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Montant à transférer (FCFA)</label>
          <div class="relative">
            <input type="number" id="txAmount" placeholder="Ex: 5000" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 pr-16">
            <span class="absolute right-3 top-3 text-xs font-bold text-slate-400">FCFA</span>
          </div>
          <p class="text-[10px] text-slate-400 mt-1">Montant min: 250 FCFA — Max: 300 000 FCFA</p>
        </div>

        <!-- CALCULATEUR DYNAMIQUE (FRAIS OU RÉDUCTION) -->
        <div class="bg-slate-800/40 p-3.5 rounded-xl border border-slate-700/50 space-y-2">
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-xs font-medium text-slate-300">Prendre en charge les frais de service ?</span>
            <input type="checkbox" id="payFeesToggle" class="w-4 h-4 text-blue-600 rounded bg-slate-700 border-slate-600">
          </label>
          <div class="text-xs border-t border-slate-700/50 pt-2 space-y-1">
            <div class="flex justify-between text-slate-400">
              <span>Ajustement :</span>
              <span id="feeDisplay" class="font-semibold text-slate-200">0 FCFA</span>
            </div>
            <div class="flex justify-between text-white font-bold text-sm pt-1">
              <span>Total à débiter :</span>
              <span id="totalDisplay" class="text-sky-400">0 FCFA</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BOUTON DE PAIEMENT DYNAMIQUE -->
      <button type="button" id="payButton" class="w-full py-3.5 bg-sky-400 hover:bg-sky-300 text-slate-950 font-bold rounded-xl transition-all shadow-lg shadow-sky-400/20">
        Payer et recevez l'argent dans l'immédiat
      </button>

    </div>

  </main>

  <script src="calculator.js"></script>
</body>
</html>
