<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification — GBBE-MULTISERVICES.CI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-xl font-extrabold text-slate-900">GBBE-MULTISERVICES.CI</h1>
      <p id="form-title" class="text-xs text-slate-500">Connectez-vous à votre espace sécurisé</p>
    </div>

    <!-- ÉTAPE 1 : IDENTIFIANTS -->
    <div id="step-credentials" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Numéro de téléphone</label>
        <input type="tel" id="phone" placeholder="Ex: 0707070707" maxlength="10" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <p id="error-msg" class="text-xs text-red-500 font-semibold hidden"></p>

      <button onclick="handleLoginOrRegister()" id="main-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-500/30">
        Se connecter
      </button>

      <div class="text-center pt-2">
        <button onclick="toggleMode()" id="toggle-mode-btn" class="text-xs text-blue-600 font-semibold hover:underline">
          Pas encore de compte ? S'inscrire
        </button>
      </div>
    </div>

    <!-- ÉTAPE 2 : CODE OTP -->
    <div id="step-otp" class="space-y-4 hidden">
      <div class="bg-blue-50 p-4 rounded-xl text-center text-xs text-blue-800 leading-relaxed">
        Un code de validation à 4 chiffres a été généré. <br>(Consultez les logs de votre serveur Render pour récupérer le code)
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Entrez le code OTP reçu</label>
        <input type="text" id="otp-code" placeholder="Ex: 4821" maxlength="6" class="w-full border border-slate-300 rounded-xl p-3 text-center text-xl tracking-widest font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>
      <p id="otp-error" class="text-xs text-red-500 font-semibold hidden"></p>

      <button onclick="verifyOtp()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-500/30">
        Valider et accéder au guichet
      </button>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    let pendingPhone = "";

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('form-title').textContent = isRegisterMode ? "Créer un nouveau compte" : "Connectez-vous à votre espace sécurisé";
      document.getElementById('main-btn').textContent = isRegisterMode ? "S'inscrire" : "Se connecter";
      document.getElementById('toggle-mode-btn').textContent = isRegisterMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    }

    async function handleLoginOrRegister() {
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.classList.add('hidden');

      if (!phone || phone.length < 10 || !password) {
        err.textContent = "Veuillez remplir correctement tous les champs.";
        err.classList.remove('hidden');
        return;
      }

      const endpoint = isRegisterMode ? '/api/register' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (!data.success) {
          err.textContent = data.error || "Une erreur est survenue.";
          err.classList.remove('hidden');
          return;
        }

        if (isRegisterMode) {
          alert("Inscription réussie ! Vous pouvez maintenant vous connecter.");
          toggleMode();
        } else {
          pendingPhone = phone;
          document.getElementById('step-credentials').classList.add('hidden');
          document.getElementById('step-otp').classList.remove('hidden');
        }
      } catch (e) {
        err.textContent = "Erreur de connexion au serveur.";
        err.classList.remove('hidden');
      }
    }

    async function verifyOtp() {
      const code = document.getElementById('otp-code').value.trim();
      const err = document.getElementById('otp-error');
      err.classList.add('hidden');

      try {
        const res = await fetch('/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: pendingPhone, code })
        });
        const data = await res.json();

        if (!data.success) {
          err.textContent = data.error;
          err.classList.remove('hidden');
          return;
        }

        localStorage.setItem('gbbe_user', JSON.stringify({ phone: data.phone }));
        window.location.href = '/';
      } catch (e) {
        err.textContent = "Erreur lors de la validation du code.";
        err.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
